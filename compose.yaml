name: saas-platform

services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-local-postgres-admin-only}
      APP_DB: ${APP_DB:-saas_platform}
      APP_DB_USER: ${APP_DB_USER:-saas_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-local-development-only}
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${APP_DB_USER}" -d "$${APP_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - backend

  migrate:
    build:
      context: ./backend
      target: development
    command: ["cargo", "run", "--", "migrate"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://saas_app:local-development-only@postgres:5432/saas_platform}
      RUST_LOG: ${RUST_LOG:-info}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
    restart: "no"

  api:
    build:
      context: ./backend
      target: development
    command: ["cargo", "watch", "-x", "run"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://saas_app:local-development-only@postgres:5432/saas_platform}
      RUST_LOG: ${RUST_LOG:-info,saas_api=debug}
      API_PORT: ${API_PORT:-3000}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-28800}
      PASSWORD_RESET_TTL_SECONDS: ${PASSWORD_RESET_TTL_SECONDS:-1800}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:5173}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_FROM: ${SMTP_FROM:-SaaS Platform <no-reply@example.test>}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_API_BASE_URL: ${STRIPE_API_BASE_URL:-https://api.stripe.com}
    depends_on:
      migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - http://localhost:3000/api/v1/health/live
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 180s
    networks:
      - backend

  frontend:
    build:
      context: ./frontend
      target: development
    command: ["pnpm", "dev", "--host", "0.0.0.0"]
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    depends_on:
      api:
        condition: service_healthy
    networks:
      - backend

  mailpit:
    image: axllent/mailpit:v1.27
    networks:
      - backend

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    profiles: ["tools"]
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio-data:/data
    networks:
      - backend

networks:
  backend:

volumes:
  postgres-data:
  minio-data:
