name: saas-platform

services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-saas_platform}
      POSTGRES_USER: ${POSTGRES_USER:-saas_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - backend

  migrate:
    build:
      context: ./backend
      target: development
    command: ["cargo", "run", "--", "migrate"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://saas_app:local-development-only@postgres:5432/saas_platform}
      RUST_LOG: ${RUST_LOG:-info}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
    restart: "no"

  api:
    build:
      context: ./backend
      target: development
    command: ["cargo", "watch", "-x", "run"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://saas_app:local-development-only@postgres:5432/saas_platform}
      RUST_LOG: ${RUST_LOG:-info,saas_api=debug}
      API_PORT: ${API_PORT:-3000}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - http://localhost:3000/api/v1/health/live
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - backend

  frontend:
    build:
      context: ./frontend
      target: development
    command: ["pnpm", "dev", "--host", "0.0.0.0"]
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    depends_on:
      api:
        condition: service_healthy
    networks:
      - backend

  mailpit:
    image: axllent/mailpit:v1.27
    profiles: ["tools"]
    networks:
      - backend

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    profiles: ["tools"]
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio-data:/data
    networks:
      - backend

networks:
  backend:

volumes:
  postgres-data:
  minio-data:

